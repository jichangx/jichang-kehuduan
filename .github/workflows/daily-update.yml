name: 每日同步机场探客户端库

on:
  schedule:
    # UTC 17:50 = 北京时间 1:50
    - cron: '50 17 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 生成 README
        run: node scripts/update.mjs

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "无变化,跳过提交"
          else
            git commit -m "每日同步机场探客户端库 $(date -u +%Y-%m-%d)"
            git push
          fi
